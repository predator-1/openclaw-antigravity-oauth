# Release: merge to main, then tag that main commit with v<package.json version> and push the tag:
#   git tag v1.4.1200 <main-sha> && git push origin v1.4.1200
#
# build   (contents: read)  tag is on main and equals the package version; npm ci, check, test,
#                           build, verify:package; npm-pack .tgz + SHA256SUMS + notes; dist/ archive.
# publish (contents: write) release commit = tagged main tree + dist/ (parent = tagged commit,
#                           never on main, fixed dates so re-runs give the same commit),
#                           verify:package --release-commit, then move tag v<version> to it,
#                           force-update branch `release`, attest (public repos), GitHub Release.
# Users install with: openclaw plugins install git:github.com/<owner>/<repo>@release (or @v<version>).
# The source commit of a release is the release commit's parent: git rev-parse v<version>^
#
# Re-runs: if the GitHub Release exists, publish fails before changing anything. To redo a
# release: gh release delete v<version> --yes -R <owner>/<repo>, then re-run this workflow run.
# The release commit is deterministic (same tree, parent, message and dates), so re-pushing the
# tag and `release` is a no-op when the tag was already moved.
#
# Pushing with GITHUB_TOKEN does not start new workflow runs, so moving the tag does not
# re-trigger this workflow. If branch protection or rulesets block GITHUB_TOKEN from pushing the
# `release` branch or the tag, set the RELEASE_PUSH_TOKEN secret (contents: write; workflow scope
# if the push is refused for touching .github/workflows); a tag push made with it re-triggers this
# workflow, which then skips because the tag already points at a release commit.
# Nothing is published to npm or ClawHub.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.kind.outputs.skip }}
    steps:
      - name: Checkout repository (full history for the main-ancestry check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Skip tags that already point at a release commit
        id: kind
        run: |
          if git cat-file -e "$GITHUB_SHA:dist/index.js" 2>/dev/null && git merge-base --is-ancestor "$GITHUB_SHA^" origin/main; then
            echo "::notice::$GITHUB_REF_NAME already points at a release commit; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tagged commit must be on main
        if: steps.kind.outputs.skip != 'true'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of origin/main; merge first, then tag a main commit"
            exit 1
          fi
          if git cat-file -e "$GITHUB_SHA:dist" 2>/dev/null; then
            echo "::error::main must be sources only, but $GITHUB_SHA tracks dist/"
            exit 1
          fi

      - name: Tag must match package.json version
        if: steps.kind.outputs.skip != 'true'
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.kind.outputs.skip != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.kind.outputs.skip != 'true'
        run: npm ci

      - name: Type check
        if: steps.kind.outputs.skip != 'true'
        run: npm run check

      - name: Run hermetic test suite (builds dist/)
        if: steps.kind.outputs.skip != 'true'
        run: npm test

      - name: Rebuild dist/ from the tagged sources and verify package and release tree shape
        if: steps.kind.outputs.skip != 'true'
        run: npm run verify:dist

      - name: Pack release files
        if: steps.kind.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          tar -cf release/dist.tar dist
          # The scoped package packs as predator-1-openclaw-antigravity-oauth-<version>.tgz;
          # release assets keep their unscoped names.
          PACKED=$(npm pack --ignore-scripts --pack-destination release --json | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename)')
          if [ "$PACKED" != "openclaw-antigravity-oauth-${VERSION}.tgz" ]; then mv "release/$PACKED" "release/openclaw-antigravity-oauth-${VERSION}.tgz"; fi
          cp "release/openclaw-antigravity-oauth-${VERSION}.tgz" release/openclaw-antigravity-oauth.tgz
          (cd release && sha256sum -- *.tgz > SHA256SUMS && sha256sum -- dist.tar > dist.tar.sha256 && cat SHA256SUMS)
          node scripts/release-notes.js "$VERSION" "$GITHUB_REPOSITORY" > release/NOTES.md

      - name: Upload release files
        if: steps.kind.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the release commit, tag and `release` branch; create the GitHub Release
      id-token: write # artifact attestation (OIDC)
      attestations: write # artifact attestation
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fail cleanly if the release already exists
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists; nothing was changed. To redo it: gh release delete $GITHUB_REF_NAME --yes -R $GITHUB_REPOSITORY, move the tag back to the main commit, then re-run this workflow."
            exit 1
          fi

      - name: Checkout the tagged main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Verify checksums
        working-directory: ${{ runner.temp }}/release
        run: sha256sum -c SHA256SUMS && sha256sum -c dist.tar.sha256

      - name: Create the release commit (tagged main tree + dist/)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf dist && tar -xf "$RUNNER_TEMP/release/dist.tar"
          git add -f dist
          tree="$(git write-tree)"
          # Fixed dates (the tagged commit's) so a re-run creates the identical commit.
          date="$(git log -1 --format=%cI "$GITHUB_SHA")"
          commit="$(GIT_AUTHOR_DATE="$date" GIT_COMMITTER_DATE="$date" \
            git commit-tree "$tree" -p "$GITHUB_SHA" -m "release: v$VERSION" -m "Built from $GITHUB_SHA (tag $GITHUB_REF_NAME on main) by $GITHUB_WORKFLOW run $GITHUB_RUN_ID.")"
          echo "sha=$commit" >> "$GITHUB_OUTPUT"
          echo "release commit $commit (parent $GITHUB_SHA)"

      - name: Verify release commit shape
        run: node scripts/verify-package.js --release-commit="${{ steps.commit.outputs.sha }}" --parent="$GITHUB_SHA"

      - name: Move the tag and the release branch to the release commit
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          git tag -f "$GITHUB_REF_NAME" "$COMMIT"
          git push --force origin "refs/tags/$GITHUB_REF_NAME" "$COMMIT:refs/heads/release"

      - name: Attest build provenance
        # Artifact attestations need a public repository (or GitHub Enterprise Cloud for
        # private ones); skip while the repository is private.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/openclaw-antigravity-oauth-${{ needs.build.outputs.version }}.tgz

      - name: Create GitHub Release
        working-directory: ${{ runner.temp }}/release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file NOTES.md \
            "openclaw-antigravity-oauth-${VERSION}.tgz" \
            "openclaw-antigravity-oauth.tgz" \
            "SHA256SUMS"
